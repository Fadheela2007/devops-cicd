# IMAGE_TAG est remplace par le numero du build dans le Jenkinsfile
# Un seul pod : Prometheus (hors du cluster) lit ainsi des compteurs coherents
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mon-app
  template:
    metadata:
      labels:
        app: mon-app
    spec:
      containers:
        - name: mon-app
          image: mon-app:IMAGE_TAG
          imagePullPolicy: Never   # image locale, chargee dans Minikube par Jenkins
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "IMAGE_TAG"
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mon-app
spec:
  type: NodePort
  selector:
    app: mon-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30081
